# Hugo Base Configuration
# =======================
# This file contains structure-only settings.
# Client-specific params are loaded from config/_default/params.yaml
# (generated from blob storage by fetch-site-config.ts)

baseURL: '/'
languageCode: 'en'
title: 'Heritage Register'  # Fallback title
publishDir: "docs"

params:
  version: "0.3.8"
  environment: "uat"
  default_show_full_asset: "false"
  starches_config:
    minSearchLength: 2
  starches:
    use_card_rendering: true
    filter_labels:
      tags: "Category"
  ros_madair:
    wasm_module: "/wasm/ros-madair/ros_madair.js"
    index_base_url: "/definitions/ros-madair/"
    rdf_base_uri: "https://doc.govt.nz/"


markup:
  goldmark:
    renderer:
      unsafe: true

module:
  imports:
    - path: 'github.com/flaxandteal/hugo-starches-fira'
    - path: 'github.com/flaxandteal/govukhugo'
    - path: 'github.com/flaxandteal/starches'
    - path: 'github.com/flaxandteal/hugo-cookies'
  mounts:
    - source: static
      target: static
    - source: node_modules/alizarin/dist/alizarin_bg.wasm
      target: static/wasm/alizarin_bg.wasm
    - source: assets/alizarin-loader-inline.ts
      target: assets/alizarin-loader.ts
    - source: node_modules/ros-madair/pkg/ros_madair.js
      target: static/wasm/ros-madair/ros_madair.js
    - source: node_modules/ros-madair/pkg/ros_madair_bg.wasm
      target: static/wasm/ros-madair/ros_madair_bg.wasm
    # maplibre-gl 6 loads its web worker from a separate file resolved
    # relative to the bundle URL, so both files must sit at the site root.
    - source: node_modules/maplibre-gl/dist/maplibre-gl-worker.mjs
      target: static/maplibre-gl-worker.mjs
    - source: node_modules/maplibre-gl/dist/maplibre-gl-shared.mjs
      target: static/maplibre-gl-shared.mjs

security:
  funcs:
    getenv:
      - '^BLOB_'
      - '^HUGO_'

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    contentDir: "content/en"
    weight: 1
  bg:
    languageName: "Bulgarian"
    contentDir: "content/bg"
    weight: 2